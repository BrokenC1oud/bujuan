name: Flutter Android 32-bit Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # cache: true # Optional: speeds up subsequent builds

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (32-bit only)
        run: |
          flutter build apk --release \
          --target-platform android-arm \
          --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-32bit-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
